# Vacuum ignore file for the v2.2 spec.
#
# These four properties are named exactly as they appear on the wire:
#  - carrier lookup details echo the upstream carrier's field names
#    (mobile_country_code, mobile_network_code, error_code) -- see
#    /v2.2/carrier/{number}, handlers/carrier.php;
#  - transactionGUID is the delivery-receipt id field in message history
#    (handlers/messages.php, dlr records).
# Renaming them in the schema would misdocument the API, so they are
# pinned here as accepted exceptions to camel-case-properties.
camel-case-properties:
  - $.components.schemas['messageHistoryData'].properties['messages'].items.properties['value'].properties['transactionGUID']
  - $.components.schemas['carrierData'].properties['carrier'].properties['mobile_country_code']
  - $.components.schemas['carrierData'].properties['carrier'].properties['mobile_network_code']
  - $.components.schemas['carrierData'].properties['carrier'].properties['error_code']
# DELETE /v2.2/acl takes a JSON body on the wire (the v2.2.0 handler rewrite);
# documented truthfully even though DELETE-with-body is discouraged style.
no-request-body:
  - $.paths['/v2.2/acl'].delete
